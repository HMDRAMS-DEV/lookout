<!doctype html>
<!-- The README banner. Rendered to docs/banner-{light,dark}.png by scripts/render-banner.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lookout banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F3; --ink: #0D0D0D; --muted: #7A7A7A; --accent: #2563EB; --waiting: #D97706; --claude: #D97757;
    --line: rgba(0,0,0,.06); --panel: rgba(255,255,255,.72); --tile: rgba(0,0,0,.035); --tile-line: rgba(0,0,0,.07);
  }
  .dark {
    --bg: #141414; --ink: #FFFFFF; --muted: #9A9A9A; --accent: #5B8DEF; --waiting: #FBBF24; --claude: #E08A6D;
    --line: rgba(255,255,255,.08); --panel: rgba(40,40,44,.82); --tile: rgba(255,255,255,.05); --tile-line: rgba(255,255,255,.08);
  }
  html, body { margin: 0; background: transparent; }
  body { width: 1280px; height: 640px; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .banner {
    position: relative; width: 1280px; height: 640px; border-radius: 32px; overflow: hidden; background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line); display: grid; grid-template-columns: 1fr 520px; align-items: center;
  }
  .text { padding-left: 88px; color: var(--ink); }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 36px 0 0; font-size: 54px; line-height: 60px; font-weight: 700; letter-spacing: -0.03em; max-width: 640px; }
  p { margin: 20px 0 0; font-size: 22px; line-height: 30px; color: var(--muted); max-width: 540px; }
  .stage { position: relative; height: 640px; display: grid; place-items: center; }
  canvas { position: absolute; inset: 0; }

  /* A mock of the popover with made-up sessions. */
  .popover {
    position: relative; width: 340px; padding: 16px; border-radius: 20px; background: var(--panel); color: var(--ink);
    backdrop-filter: blur(20px); box-shadow: 0 40px 100px rgba(37,99,235,.24), 0 0 0 1px var(--tile-line);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.035em; }
  .mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 28%, transparent); }
  .head span { font-size: 13px; font-weight: 500; color: var(--muted); }
  .section { margin: 14px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .row {
    position: relative; display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 6px; border-radius: 14px;
    background: var(--tile); box-shadow: inset 0 0 0 1px var(--tile-line);
  }
  .row.fresh::before { content: ''; position: absolute; left: 0; width: 3px; height: 18px; border-radius: 2px; background: var(--waiting); }
  .badge { position: relative; flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
  .badge svg { width: 14px; height: 14px; }
  .badge.claude { color: var(--claude); background: color-mix(in srgb, var(--claude) 10%, transparent); }
  .badge.other { color: var(--ink); background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .badge b { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--bg); }
  .waiting b { background: var(--waiting); }
  .running b { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11px; color: var(--muted); }
  .time { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .waiting .time { color: var(--waiting); }
  .running .time { color: var(--accent); }
</style>
</head>
<body>
<div class="banner">
  <div class="text">
    <div class="brand"><img src="../Lookout/AppIcon.iconset/icon_256x256.png" alt="">Lookout</div>
    <h1>Know the moment your agents need you.</h1>
    <p>A macOS menu bar app that watches Claude Code, Codex, and Cursor, and tells you when one finishes or is waiting.</p>
  </div>
  <div class="stage">
    <canvas id="halo" width="1040" height="1280" style="width: 520px; height: 640px"></canvas>
    <div class="popover" id="popover"></div>
  </div>
</div>
<script>
  const dark = location.search.includes('dark');
  if (dark) document.documentElement.classList.add('dark');

  const icons = {
    claude: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 1v12M1.8 4l10.4 6M1.8 10l10.4-6"/></svg>',
    codex: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3.5 1.5 7l3 3.5M9.5 3.5l3 3.5-3 3.5M8 2.5 6 11.5"/></svg>',
    cursor: '<svg viewBox="0 0 14 14" fill="currentColor"><path d="M2.5 1.5 11.5 7l-4 .9L5.6 12z"/></svg>',
  };
  const rows = [
    ['Needs you'],
    ['waiting', 'claude', 'Approve database migration', 'Claude Code · api · Input needed', '2m', true],
    ['Running'],
    ['running', 'codex', 'Refactor checkout flow', 'Codex · web', '41s'],
    ['running', 'claude', 'Fix flaky login test', 'Claude Code · ios', '3m'],
    ['running', 'cursor', 'Dark mode for settings', 'Cursor · dashboard', '6m'],
  ];
  const names = { claude: 'Claude Code', codex: 'Codex', cursor: 'Cursor' };
  document.getElementById('popover').innerHTML =
    '<div class="head"><div class="mark">Lookout<i></i></div><span>1 needs you</span></div>' +
    rows.map(([phase, agent, title, sub, time, fresh]) => agent
      ? `<div class="row ${phase}${fresh ? ' fresh' : ''}"><div class="badge ${agent === 'claude' ? 'claude' : 'other'}">${icons[agent]}<b></b></div>` +
        `<div class="info"><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="time">${time}</div></div>`
      : `<div class="section">${phase}</div>`).join('');

  // Pacer's dot ripple, frozen mid-wave, in Lookout's running and waiting colors.
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const ctx = document.getElementById('halo').getContext('2d');
  ctx.scale(2, 2);
  const a = rgb(css('--accent')), v = rgb(css('--waiting'));
  const w = 520, h = 640, cx = w / 2, cy = h / 2, max = 300, pitch = 18;
  for (let y = cy % pitch; y < h; y += pitch) {
    for (let x = cx % pitch; x < w; x += pitch) {
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy), fade = 1 - d / max;
      if (fade <= 0) continue;
      const wave = .5 + .5 * Math.sin(d / 30 - 1.2);
      const c = mix(a, v, (Math.atan2(dy, dx) / Math.PI + 1) / 2);
      ctx.fillStyle = `rgba(${c.join(',')},${(.12 + wave * .45) * fade})`;
      ctx.beginPath(); ctx.arc(x, y, .9 + wave * 2.6 * fade, 0, 7); ctx.fill();
    }
  }
</script>
</body>
</html>
